project:
  name: "fnd-neuroimaging-os_validation"
  description: "FND neuroimaging meta-analysis search (os_validation)"
  version: "1.0"

search:
  mode: "os_validation"
  date_start: "inception"        # "inception" or YYYY
  date_end: "2015/08/31"          # YYYY/MM/DD or "today"
  language_filter: true    # true=English-only

  syntax:
    pubmed:
      use_mesh: false
      use_exclusions: false
      use_human_filter: false
    mri_fallback: true

term_sets:
  fnd_terms:
      - "dissociative disorder"
      - "functional disorder"
      - "conversion disorder"
  imaging_terms:
      - "neuro imaging"
      - "magnetic resonance imaging"
      - "fMRI"
      - "MRI"
      - "VBM"
      - "PET"

blocks:
  block_a: "fnd_terms"
  block_b: "imaging_terms"
  block_c: null
