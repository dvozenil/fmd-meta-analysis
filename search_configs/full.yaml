project:
  name: "fnd-neuroimaging-full"
  description: "FND neuroimaging meta-analysis search (full)"
  version: "1.0"

search:
  mode: "full"
  date_start: "inception"        # "inception" or YYYY
  date_end: "today"              # YYYY/MM/DD or "today"
  language_filter: true    # true=English-only

  syntax:
    pubmed:
      use_mesh: true
      mesh_terms_fnd: ["Conversion Disorder", "Dissociative Disorders"]
      mesh_terms_imaging: ["Neuroimaging", "Magnetic Resonance Imaging", "Diffusion Tensor Imaging", "Positron-Emission Tomography", "Tomography, Emission-Computed, Single-Photon"]
      use_exclusions: true
      use_human_filter: true
    mri_fallback: false

